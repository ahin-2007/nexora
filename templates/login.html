{% extends "base.html" %}

{% block title %}Student Sign In | Nexora{% endblock %}

{% block content %}
<div class="auth-wrapper">
    <div class="hero-bg-blobs">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
    </div>
    
    <div class="glass-card auth-card">
        <div class="auth-header">
            <h2>Student Sign In</h2>
            <p>Sign in to resume tracking your course progression.</p>
        </div>
        
        <form class="auth-form" action="{{ url_for('login', next=next) }}" method="POST">
            <div class="form-group">
                <label for="email">Email Address</label>
                <div class="form-control-wrap">
                    <i data-lucide="mail" style="width:16px;height:16px;"></i>
                    <input type="email" id="email" name="email" class="form-control" placeholder="name@example.com" required>
                </div>
            </div>
            
            <div class="form-group">
                <label for="password">Password</label>
                <div class="form-control-wrap">
                    <i data-lucide="lock" style="width:16px;height:16px;"></i>
                    <input type="password" id="password" name="password" class="form-control" placeholder="Enter your password" required>
                </div>
            </div>
            
            <button type="submit" class="btn btn-primary" style="margin-top:12px;" id="login-submit-btn">
                Sign In <i data-lucide="log-in" style="width:18px;height:18px;"></i>
            </button>
        </form>
        
        <div class="auth-footer-text">
            Don't have an account? <a href="{{ url_for('register') }}">Sign Up</a>
        </div>
        
        <div class="auth-footer-text" style="margin-top: 16px; padding-top: 12px; border-top: 1px solid var(--color-border); font-size: 13px;">
            Are you an administrator? <a href="{{ url_for('admin_login') }}" style="color: var(--color-primary); font-weight: 600;">Admin Login</a>
        </div>
    </div>
</div>
{% endblock %}
